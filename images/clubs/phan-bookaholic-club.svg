<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="pbcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="pbcGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="94" fill="url(#pbcGrad)" stroke="url(#pbcGold)" stroke-width="4"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
  
  <path id="pbcTop" d="M 30,100 A 70,70 0 0,1 170,100" fill="none"/>
  <path id="pbcBottom" d="M 170,100 A 70,70 0 0,1 30,100" fill="none"/>
  
  <text font-family="'Montserrat', 'Arial', sans-serif" font-size="10.5" font-weight="800" fill="#a7f3d0" letter-spacing="1.5">
    <textPath href="#pbcTop" startOffset="50%" text-anchor="middle">PHAN BOOKAHOLIC CLUB</textPath>
  </text>
  <text font-family="'Montserrat', 'Arial', sans-serif" font-size="9" font-weight="700" fill="#ffffff" letter-spacing="1.2">
    <textPath href="#pbcBottom" startOffset="50%" text-anchor="middle">VĂN HÓA ĐỌC • EST. 2016 • PBC</textPath>
  </text>
  
  <!-- Central Emblem: Open Book & Rising Sun / Bookmark -->
  <g transform="translate(100, 98) scale(0.95)">
    <!-- Sunburst behind book -->
    <circle cx="0" cy="-12" r="14" fill="#fef08a" opacity="0.9"/>
    <path d="M 0,-32 L 0,-24 M -16,-26 L -10,-20 M 16,-26 L 10,-20" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Open Book Pages -->
    <path d="M 0,16 C -16,10 -34,11 -42,6 L -42,-14 C -34,-9 -16,-10 0,-4 Z" fill="#ffffff"/>
    <path d="M 0,16 C 16,10 34,11 42,6 L 42,-14 C 34,-9 16,-10 0,-4 Z" fill="#e2e8f0"/>
    
    <!-- Book Cover Base -->
    <path d="M -44,8 L -44,10 C -34,15 -16,14 0,20 C 16,14 34,15 44,10 L 44,8 C 34,13 16,12 0,18 C -16,12 -34,13 -44,8 Z" fill="#047857"/>
    
    <!-- Bookmark Ribbon -->
    <path d="M 0,-4 L 0,24 L 4,20 L 8,24 L 8,-3 Z" fill="#ef4444"/>
    
    <!-- Page Lines -->
    <line x1="-34" y1="-4" x2="-10" y2="-1" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="-34" y1="2" x2="-10" y2="5" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="10" y1="-1" x2="34" y2="-4" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="10" y1="5" x2="34" y2="2" stroke="#94a3b8" stroke-width="1.5"/>
  </g>
</svg>