<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="cpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b3c68"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="94" fill="url(#cpGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
  
  <!-- Outer Ring Text Path -->
  <path id="circlePathTop" d="M 30,100 A 70,70 0 0,1 170,100" fill="none"/>
  <path id="circlePathBottom" d="M 170,100 A 70,70 0 0,1 30,100" fill="none"/>
  
  <text font-family="'Montserrat', 'Arial', sans-serif" font-size="10.5" font-weight="800" fill="#fbbf24" letter-spacing="1.5">
    <textPath href="#circlePathTop" startOffset="50%" text-anchor="middle">CP THE NEWS • CHUYÊN PHAN</textPath>
  </text>
  <text font-family="'Montserrat', 'Arial', sans-serif" font-size="9" font-weight="700" fill="#ffffff" letter-spacing="1.2">
    <textPath href="#circlePathBottom" startOffset="50%" text-anchor="middle">BÁO CHÍ &amp; NỘI SAN • EST. 2015</textPath>
  </text>
  
  <!-- Central Emblem: Newspaper & Quill / Microphone -->
  <g transform="translate(100, 98) scale(0.9)">
    <!-- Folded Newspaper Base -->
    <rect x="-42" y="-22" width="84" height="52" rx="4" fill="#ffffff" opacity="0.95"/>
    <rect x="-36" y="-16" width="30" height="20" rx="2" fill="#0b3c68"/>
    <line x1="2" y1="-14" x2="36" y2="-14" stroke="#0b3c68" stroke-width="3" stroke-linecap="round"/>
    <line x1="2" y1="-7" x2="36" y2="-7" stroke="#0b3c68" stroke-width="2" stroke-linecap="round"/>
    <line x1="2" y1="0" x2="28" y2="0" stroke="#0b3c68" stroke-width="2" stroke-linecap="round"/>
    <line x1="-36" y1="11" x2="36" y2="11" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-36" y1="17" x2="36" y2="17" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-36" y1="23" x2="16" y2="23" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Quill / Pen Overlay -->
    <path d="M 12,-36 C 24,-24 20,-10 14,-2 L 28,12 L 20,16 L 8,4 L -2,12 L 4,-4 C 6,-18 10,-28 12,-36 Z" fill="url(#goldGrad)"/>
    <circle cx="16" cy="-14" r="2.5" fill="#ffffff"/>
  </g>
  
  <!-- Stars -->
  <polygon points="26,100 28,95 33,95 29,92 31,87 26,90 22,87 23,92 20,95 24,95" fill="#fbbf24"/>
  <polygon points="174,100 176,95 181,95 177,92 179,87 174,90 170,87 171,92 168,95 172,95" fill="#fbbf24"/>
</svg>