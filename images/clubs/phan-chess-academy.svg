<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="pcaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="pcaSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="94" fill="url(#pcaGrad)" stroke="url(#pcaSilver)" stroke-width="4"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
  
  <path id="pcaTop" d="M 30,100 A 70,70 0 0,1 170,100" fill="none"/>
  <path id="pcaBottom" d="M 170,100 A 70,70 0 0,1 30,100" fill="none"/>
  
  <text font-family="'Montserrat', 'Arial', sans-serif" font-size="10.5" font-weight="800" fill="#ffffff" letter-spacing="1.5">
    <textPath href="#pcaTop" startOffset="50%" text-anchor="middle">PHAN CHESS ACADEMY</textPath>
  </text>
  <text font-family="'Montserrat', 'Arial', sans-serif" font-size="9" font-weight="700" fill="#bae6fd" letter-spacing="1.2">
    <textPath href="#pcaBottom" startOffset="50%" text-anchor="middle">PCA • EST. 2021 • CỜ VUA TRÍ TUỆ</textPath>
  </text>
  
  <!-- Central Emblem: Chess Knight & Heraldic Shield -->
  <g transform="translate(100, 98) scale(0.95)">
    <!-- Shield Outline -->
    <path d="M -26,-22 L 26,-22 C 26,-22 28,10 0,26 C -28,10 -26,-22 -26,-22 Z" fill="#0f172a" stroke="url(#pcaSilver)" stroke-width="2"/>
    
    <!-- Chess Knight Silhouette -->
    <path d="M -14,14 L 14,14 C 14,14 10,6 6,4 C 10,2 14,-6 11,-12 C 9,-15 5,-17 2,-16 C 1,-18 -2,-20 -6,-18 C -11,-16 -12,-11 -13,-6 C -18,-2 -19,4 -14,14 Z" fill="url(#pcaSilver)"/>
    <!-- Knight Eye -->
    <circle cx="2" cy="-10" r="1.5" fill="#0284c7"/>
    <!-- Mane details -->
    <path d="M 6,-8 L 10,-4 M 4,-3 L 8,1" stroke="#0284c7" stroke-width="1.5"/>
  </g>
</svg>