<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="ppsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="94" fill="url(#ppsGrad)" stroke="#818cf8" stroke-width="4"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
  
  <path id="ppsTop" d="M 30,100 A 70,70 0 0,1 170,100" fill="none"/>
  <path id="ppsBottom" d="M 170,100 A 70,70 0 0,1 30,100" fill="none"/>
  
  <text font-family="'Montserrat', 'Arial', sans-serif" font-size="10" font-weight="800" fill="#c7d2fe" letter-spacing="1.5">
    <textPath href="#ppsTop" startOffset="50%" text-anchor="middle">PHAN PHOTOGRAPHY SQUAD</textPath>
  </text>
  <text font-family="'Montserrat', 'Arial', sans-serif" font-size="9" font-weight="700" fill="#ffffff" letter-spacing="1.2">
    <textPath href="#ppsBottom" startOffset="50%" text-anchor="middle">PPS • EST. 2017 • NHIẾP ẢNH &amp; MEDIA</textPath>
  </text>
  
  <!-- Central Emblem: SLR Camera & Lens Aperture -->
  <g transform="translate(100, 98) scale(0.95)">
    <!-- Camera Body -->
    <rect x="-38" y="-14" width="76" height="42" rx="6" fill="#1e1b4b" stroke="#ffffff" stroke-width="2.5"/>
    <polygon points="-16,-14 -10,-24 10,-24 16,-14" fill="#1e1b4b" stroke="#ffffff" stroke-width="2.5"/>
    <!-- Flash & Red Dot -->
    <rect x="20" y="-10" width="8" height="5" rx="1.5" fill="#f87171"/>
    <circle cx="-26" cy="-6" r="3" fill="#38bdf8"/>
    
    <!-- Lens Circles -->
    <circle cx="0" cy="7" r="18" fill="url(#lensGrad)" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="0" cy="7" r="12" fill="#0f172a"/>
    <!-- Aperture Blades -->
    <circle cx="0" cy="7" r="6" fill="#38bdf8"/>
    <!-- Glare Reflex -->
    <path d="M -8,0 C -6,-3 -2,-5 2,-4" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
</svg>