<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="aokGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="aokGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="94" fill="#0f172a" stroke="url(#aokGold)" stroke-width="4"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="url(#aokGold)" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  
  <path id="aokTop" d="M 30,100 A 70,70 0 0,1 170,100" fill="none"/>
  <path id="aokBottom" d="M 170,100 A 70,70 0 0,1 30,100" fill="none"/>
  
  <text font-family="'Montserrat', 'Arial', sans-serif" font-size="10" font-weight="800" fill="#fef08a" letter-spacing="1.5">
    <textPath href="#aokTop" startOffset="50%" text-anchor="middle">ARENA OF KNOWLEDGE • AOK</textPath>
  </text>
  <text font-family="'Montserrat', 'Arial', sans-serif" font-size="8.5" font-weight="700" fill="#ffffff" letter-spacing="1.2">
    <textPath href="#aokBottom" startOffset="50%" text-anchor="middle">ĐƯỜNG LÊN ĐỈNH OLYMPIA • CHUYÊN PHAN</textPath>
  </text>
  
  <!-- Central Emblem: Olympia Laurel Wreath & Flaming Torch -->
  <g transform="translate(100, 98) scale(0.95)">
    <!-- Laurel Wreath Leaves Left -->
    <path d="M -12,28 C -34,22 -44,-2 -26,-22 C -24,-24 -20,-18 -22,-14 C -34,2 -24,18 -8,22 Z" fill="url(#aokGold)"/>
    <!-- Laurel Wreath Leaves Right -->
    <path d="M 12,28 C 34,22 44,-2 26,-22 C 24,-24 20,-18 22,-14 C 34,2 24,18 8,22 Z" fill="url(#aokGold)"/>
    
    <!-- Mountain Summit behind Torch -->
    <polygon points="-24,18 0,-14 24,18" fill="#1e293b"/>
    <polygon points="0,-14 -7,-4 7,-4" fill="#ffffff" opacity="0.9"/>
    
    <!-- Torch Handle & Flame -->
    <rect x="-3" y="-2" width="6" height="24" rx="2" fill="url(#aokGold)"/>
    <path d="M -7,-2 L 7,-2 L 5,6 L -5,6 Z" fill="#94a3b8"/>
    <!-- Flame -->
    <path d="M 0,-26 C 6,-20 9,-14 4,-6 C 2,-4 0,-4 -1,-6 C -3,-10 -7,-8 -6,-14 C -6,-20 -2,-24 0,-26 Z" fill="#ef4444"/>
    <path d="M 0,-22 C 3,-18 4,-14 1,-8 C 0,-6 -1,-8 -2,-11 C -2,-15 -1,-18 0,-22 Z" fill="#facc15"/>
  </g>
</svg>