<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="hstpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="hstpNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="94" fill="url(#hstpGrad)" stroke="url(#hstpNeon)" stroke-width="4"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
  
  <path id="hstpTop" d="M 30,100 A 70,70 0 0,1 170,100" fill="none"/>
  <path id="hstpBottom" d="M 170,100 A 70,70 0 0,1 30,100" fill="none"/>
  
  <text font-family="'Montserrat', 'Arial', sans-serif" font-size="11" font-weight="800" fill="#f472b6" letter-spacing="1.5">
    <textPath href="#hstpTop" startOffset="50%" text-anchor="middle">HSTP DANCE CLUB</textPath>
  </text>
  <text font-family="'Montserrat', 'Arial', sans-serif" font-size="9" font-weight="700" fill="#ffffff" letter-spacing="1.2">
    <textPath href="#hstpBottom" startOffset="50%" text-anchor="middle">VŨ ĐẠO • EST. 2018 • PASSION &amp; BEAT</textPath>
  </text>
  
  <!-- Central Emblem: Dynamic Dancer Silhouette & Music Waves -->
  <g transform="translate(100, 98) scale(0.95)">
    <!-- Neon Soundwaves Circle -->
    <circle cx="0" cy="2" r="30" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>
    <circle cx="0" cy="2" r="22" fill="none" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="4,4"/>
    
    <!-- Dynamic Dancer Silhouette -->
    <!-- Head -->
    <circle cx="2" cy="-24" r="5" fill="#ffffff"/>
    <!-- Body & Limbs -->
    <path d="M 0,-18 L 8,-6 L -4,4 L -2,24" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M -4,4 L 14,14 L 24,10" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 2,-14 L -18,-8 L -26,-18" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 4,-14 L 22,-20 L 32,-12" stroke="#f472b6" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
</svg>