<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="pdfcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#831843"/>
    </linearGradient>
    <linearGradient id="goldDfc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="94" fill="url(#pdfcGrad)" stroke="url(#goldDfc)" stroke-width="4"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
  
  <path id="pdfcTop" d="M 30,100 A 70,70 0 0,1 170,100" fill="none"/>
  <path id="pdfcBottom" d="M 170,100 A 70,70 0 0,1 30,100" fill="none"/>
  
  <text font-family="'Montserrat', 'Arial', sans-serif" font-size="9.5" font-weight="800" fill="#fbcfe8" letter-spacing="1.5">
    <textPath href="#pdfcTop" startOffset="50%" text-anchor="middle">PHAN DESIGN &amp; FASHION</textPath>
  </text>
  <text font-family="'Montserrat', 'Arial', sans-serif" font-size="9" font-weight="700" fill="#ffffff" letter-spacing="1.2">
    <textPath href="#pdfcBottom" startOffset="50%" text-anchor="middle">PDFC • EST. 2020 • CREATIVE ARTS</textPath>
  </text>
  
  <!-- Central Emblem: Palette, Brush & Haute Couture Mannequin -->
  <g transform="translate(100, 98) scale(0.95)">
    <!-- Fashion Mannequin Center -->
    <ellipse cx="0" cy="-20" rx="3" ry="4" fill="#ffffff"/>
    <path d="M -8,-14 C -6,-6 -10,6 -7,16 L 7,16 C 10,6 6,-6 8,-14 Z" fill="#ffffff"/>
    <line x1="0" y1="16" x2="0" y2="28" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="-8" y1="28" x2="8" y2="28" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Paintbrush crossed -->
    <path d="M -22,-16 L 22,20" stroke="#fbcfe8" stroke-width="3" stroke-linecap="round"/>
    <polygon points="22,20 25,25 20,23" fill="#fbcfe8"/>
    
    <!-- Color Drops -->
    <circle cx="-16" cy="4" r="3" fill="#38bdf8"/>
    <circle cx="16" cy="-6" r="3" fill="#facc15"/>
    <circle cx="-12" cy="-8" r="2.5" fill="#a7f3d0"/>
  </g>
</svg>