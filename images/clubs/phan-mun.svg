<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="munGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="94" fill="url(#munGrad)" stroke="#38bdf8" stroke-width="4"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
  
  <path id="munTop" d="M 30,100 A 70,70 0 0,1 170,100" fill="none"/>
  <path id="munBottom" d="M 170,100 A 70,70 0 0,1 30,100" fill="none"/>
  
  <text font-family="'Montserrat', 'Arial', sans-serif" font-size="10" font-weight="800" fill="#e0f2fe" letter-spacing="1.5">
    <textPath href="#munTop" startOffset="50%" text-anchor="middle">PHAN BOI CHAU MODEL UN</textPath>
  </text>
  <text font-family="'Montserrat', 'Arial', sans-serif" font-size="9" font-weight="700" fill="#ffffff" letter-spacing="1.2">
    <textPath href="#munBottom" startOffset="50%" text-anchor="middle">PMU • EST. 2019 • DIPLOMACY</textPath>
  </text>
  
  <!-- Central Emblem: UN Olive Branches & Globe Grid -->
  <g transform="translate(100, 98) scale(0.95)">
    <!-- Globe -->
    <circle cx="0" cy="0" r="24" fill="#0369a1" stroke="#ffffff" stroke-width="2"/>
    <line x1="-24" y1="0" x2="24" y2="0" stroke="#ffffff" stroke-width="1.2"/>
    <line x1="0" y1="-24" x2="0" y2="24" stroke="#ffffff" stroke-width="1.2"/>
    <ellipse cx="0" cy="0" rx="14" ry="24" fill="none" stroke="#ffffff" stroke-width="1.2"/>
    
    <!-- UN Olive Wreath -->
    <path d="M -16,24 C -36,16 -38,-14 -18,-24 M 16,24 C 36,16 38,-14 18,-24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Olive Leaves -->
    <circle cx="-28" cy="4" r="3" fill="#38bdf8"/>
    <circle cx="-24" cy="-10" r="3" fill="#38bdf8"/>
    <circle cx="28" cy="4" r="3" fill="#38bdf8"/>
    <circle cx="24" cy="-10" r="3" fill="#38bdf8"/>
  </g>
</svg>