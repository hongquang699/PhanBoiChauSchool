# ==============================================================================
# QUY TẮC WAF (WEB APPLICATION FIREWALL) - MODSECURITY & OWASP CRS
# Dành cho Website Trường THPT Chuyên Phan Bội Châu
# ==============================================================================

# Bật công cụ kiểm tra ModSecurity
SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess Off
SecResponseBodyMimeType text/plain text/html text/xml

# Giới hạn kích thước body để chống DoS
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072

# ------------------------------------------------------------------------------
# 1. CHẶN SCANNER BOTS & CÔNG CỤ TẤN CÔNG TỰ ĐỘNG
# ------------------------------------------------------------------------------
SecRule REQUEST_HEADERS:User-Agent "@pmFromFile bad_user_agents.data" \
    "id:100001,phase:1,deny,status:403,log,msg:'Phat hien Scanner Bot / Hacker Tool'"

SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(sqlmap|nikto|acunetix|dirbuster|nmap|masscan|wpscan|hydra)" \
    "id:100002,phase:1,deny,status:403,log,msg:'Tu choi truy cap tu cong cu tan cong tu dong'"

# ------------------------------------------------------------------------------
# 2. PHÒNG VỆ SQL INJECTION (SQLi)
# ------------------------------------------------------------------------------
SecRule ARGS|REQUEST_COOKIES|REQUEST_HEADERS "@rx (?i)(\b(select|union|insert|update|delete|drop|truncate|alter|create)\b.*\b(from|into|table|database)\b)" \
    "id:100010,phase:2,deny,status:403,log,msg:'Phat hien hanh vi tan cong SQL Injection tieu chuan'"

SecRule ARGS|REQUEST_COOKIES "@rx (?i)('|\%27).*(\b(or|and)\b.*(=|>|<|like)|--|#|\/\*)" \
    "id:100011,phase:2,deny,status:403,log,msg:'Phat hien ky tu dac trung bypass SQL Injection'"

SecRule ARGS|REQUEST_COOKIES "@rx (?i)(benchmark\(|sleep\(|waitfor\s+delay)" \
    "id:100012,phase:2,deny,status:403,log,msg:'Phat hien Time-based Blind SQL Injection'"

# ------------------------------------------------------------------------------
# 3. PHÒNG VỆ CROSS-SITE SCRIPTING (XSS)
# ------------------------------------------------------------------------------
SecRule ARGS|REQUEST_HEADERS "@rx (?i)(<script[^>]*>.*<\/script>|<img[^>]+src=[^>]*onerror=|<svg[^>]+onload=)" \
    "id:100020,phase:2,deny,status:403,log,msg:'Phat hien script doc hai Cross-Site Scripting (XSS)'"

SecRule ARGS|REQUEST_COOKIES "@rx (?i)(javascript:|vbscript:|data:text\/html)" \
    "id:100021,phase:2,deny,status:403,log,msg:'Phat hien ma thuc thi Javascript Schema doc hai'"

# ------------------------------------------------------------------------------
# 4. PHÒNG VỆ PATH TRAVERSAL / LFI / RFI
# ------------------------------------------------------------------------------
SecRule ARGS|REQUEST_URI "@rx (?i)(\.\.\/|\.\.\\|%2e%2e%2f|%2e%2e\/|\.\.%2f)" \
    "id:100030,phase:2,deny,status:403,log,msg:'Phat hien hanh vi leo thang thu muc Path Traversal'"

SecRule ARGS|REQUEST_URI "@rx (?i)(\/etc\/passwd|\/windows\/win\.ini|\/boot\.ini)" \
    "id:100031,phase:2,deny,status:403,log,msg:'Phat hien hanh vi doc file he thong nhay cam (LFI)'"

# ------------------------------------------------------------------------------
# 5. PHÒNG VỆ RÒ RỈ DỮ LIỆU & FILE THỰC THI (FILE UPLOAD PROTECTION)
# ------------------------------------------------------------------------------
SecRule FILES_NAMES "@rx \.(php|phtml|php3|php4|php5|php7|asp|aspx|jsp|sh|bash|py|pl|cgi|exe|bat)$" \
    "id:100040,phase:2,deny,status:403,log,msg:'Chan upload file chua ma thuc thi back-door nguy hiem'"
