# ==============================================================================
# CẤU HÌNH BẢO MẬT MÁY CHỦ NGINX CHO WEBSITE THPT CHUYÊN PHAN BỘI CHÂU
# Tuân thủ tiêu chuẩn: HTTPS/TLS, WAF, Rate Limiting, Security Headers
# ==============================================================================

# Khởi tạo vùng nhớ giới hạn tốc độ truy cập (Rate Limiting) chống tấn công DDoS & Brute Force
limit_req_zone $binary_remote_addr zone=web_req_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

# ------------------------------------------------------------------------------
# 1. CHUYỂN HƯỚNG BẮT BUỘC HTTP -> HTTPS (PORT 80 -> 443)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name thpt-chuyenphanboichau-nghean.edu.vn www.thpt-chuyenphanboichau-nghean.edu.vn;

    # Chặn hiển thị phiên bản Nginx
    server_tokens off;

    # Chuyển hướng vĩnh viễn (301) sang HTTPS
    return 301 https://$host$request_uri;
}

# ------------------------------------------------------------------------------
# 2. MÁY CHỦ CHÍNH HTTPS (PORT 443)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name thpt-chuyenphanboichau-nghean.edu.vn www.thpt-chuyenphanboichau-nghean.edu.vn;

    root /var/www/gioithieuPBC;
    index index.html;

    # Ẩn phiên bản máy chủ
    server_tokens off;

    # --------------------------------------------------------------------------
    # THIẾT LẬP SSL / TLS CHUẨN BẢO MẬT CAO
    # --------------------------------------------------------------------------
    ssl_certificate /etc/letsencrypt/live/thpt-chuyenphanboichau-nghean.edu.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thpt-chuyenphanboichau-nghean.edu.vn/privkey.pem;

    # Chỉ hỗ trợ TLSv1.2 và TLSv1.3 (Loại bỏ hoàn toàn SSLv2, SSLv3, TLSv1.0, TLSv1.1 lỗi thời)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;

    # Tối ưu hóa bộ nhớ đệm TLS session
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Bật OCSP Stapling để tăng tốc độ và bảo mật xác thực chứng chỉ
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # --------------------------------------------------------------------------
    # SECURITY HEADERS (BẢO VỆ ĐẦU RA ỨNG DỤNG)
    # --------------------------------------------------------------------------
    # HSTS: Buộc trình duyệt chỉ sử dụng kết nối HTTPS trong 1 năm
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Chống Clickjacking: Ngăn chặn website bị nhúng vào iframe của website lạ
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Chống MIME-sniffing: Ép trình duyệt tuân thủ MIME Type được chỉ định
    add_header X-Content-Type-Options "nosniff" always;

    # Bộ lọc XSS trình duyệt (phòng thủ thứ cấp)
    add_header X-XSS-Protection "1; mode=block" always;

    # Kiểm soát rò rỉ URL tham chiếu khi bấm liên kết ngoài
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Giới hạn quyền truy cập phần cứng nhạy cảm
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Content Security Policy (CSP): Giới hạn nguồn gốc tài nguyên được phép tải
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; media-src 'self' blob:; frame-src 'self' https://www.youtube.com;" always;

    # --------------------------------------------------------------------------
    # GIỚI HẠN TẢI & RATE LIMITING
    # --------------------------------------------------------------------------
    # Giới hạn kích thước gói tin gửi lên (Chống tấn công tràn bộ nhớ upload)
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # Áp dụng giới hạn tần suất truy vấn
    limit_req zone=web_req_limit burst=30 nodelay;
    limit_conn addr_limit 20;

    # --------------------------------------------------------------------------
    # PHÒNG VỆ FILE HỆ THỐNG VÀ ĐƯỜNG DẪN NHẠY CẢM
    # --------------------------------------------------------------------------
    # Chặn truy cập các file ẩn (.git, .env, .htaccess, .vscode)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Chặn thực thi script trong thư mục tải lên (File Security)
    location ~* ^/(images|videos|uploads)/.*(\.php|\.jsp|\.asp|\.py|\.sh|\.exe|\.pl)$ {
        deny all;
        return 403;
    }

    # Bật nén Gzip an toàn
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # Định tuyến tài nguyên tĩnh và cache
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|mp4|webm|woff2|woff|ttf|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Điều hướng mặc định
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # Trang thông báo lỗi chuẩn bảo mật (không để lộ stacktrace của server)
    error_page 403 /403.html;
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
}
